name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude:implement') ||
      (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # The action has its own internal trigger check independent of the job-level
          # `if:` above. Its default label_trigger is "claude", which does NOT match our
          # "claude:implement" label, so without this override the action silently no-ops
          # ("Trigger result: false") even though the job runs.
          label_trigger: "claude:implement"

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'
          claude_args: |
            --append-system-prompt "After you finish implementing the requested change and opening a pull request, perform a brief self-review of your own diff (correctness, security, adherence to project conventions). If you find no blocking issues, run \`gh pr edit <PR_NUMBER> --add-label claude:ready-to-merge\` on the pull request you just created. If you find any blocking issues, do NOT add that label — instead leave a PR comment explaining the concerns and stop."

      - name: Auto-merge if Claude marked the PR ready
        if: success()
        env:
          GH_TOKEN: ${{ secrets.ADMIN_MERGE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ]; then
            ISSUE_NUMBER="${{ github.event.issue.number }}"
            PR_NUMBER=$(gh pr list --repo "$REPO" --state open --json number,headRefName \
              --jq "[.[] | select(.headRefName | startswith(\"claude/issue-${ISSUE_NUMBER}-\"))][0].number")
          fi
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No related pull request found; skipping auto-merge."
            exit 0
          fi

          HEAD_REF=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName --jq .headRefName)
          if [[ "$HEAD_REF" != claude/* ]]; then
            echo "PR #$PR_NUMBER head ref '$HEAD_REF' is not a Claude-managed branch; skipping auto-merge."
            exit 0
          fi

          HAS_LABEL=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '([.labels[].name] | index("claude:ready-to-merge")) != null')
          if [ "$HAS_LABEL" = "true" ]; then
            gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch
          else
            echo "PR #$PR_NUMBER is not labeled claude:ready-to-merge; leaving open for human review."
          fi

